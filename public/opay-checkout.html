<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPay Checkout - Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --opay-green: #00b894;
            --opay-dark: #2d3436;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-muted: #636e72;
            --border: #dfe6e9;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .checkout-container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .header {
            background: var(--opay-green);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .content {
            padding: 2rem;
        }
        .amount-display {
            text-align: center;
            margin-bottom: 2rem;
        }
        .amount-display span {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 0.5rem;
        }
        .amount-display h2 {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--opay-dark);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--opay-green);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: var(--opay-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover {
            background: #00a884;
            transform: translateY(-2px);
        }
        .footer {
            text-align: center;
            padding: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding: 0.75rem;
            }

            .checkout-container {
                border-radius: 12px;
            }

            .header,
            .content {
                padding: 1.25rem;
            }

            .header h1 {
                font-size: 1.45rem;
            }

            .amount-display {
                margin-bottom: 1.25rem;
            }

            .amount-display h2 {
                font-size: 2rem;
                overflow-wrap: anywhere;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            .form-group[style*="grid-template-columns"] {
                grid-template-columns: 1fr !important;
            }

            .form-group input {
                min-height: 44px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="header">
            <h1>OPay Checkout</h1>
            <p>Secured by OPay</p>
        </div>
        <div class="content">
            <div class="amount-display">
                <span>Total Amount to Pay</span>
                <h2 id="display-amount">₦0.00</h2>
            </div>
            
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" placeholder="5555 5555 5555 5555" value="5555 5555 5555 5555" readonly>
            </div>
            
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label>Expiry Date</label>
                    <input type="text" placeholder="MM/YY" value="12/28" readonly>
                </div>
                <div>
                    <label>CVV</label>
                    <input type="text" placeholder="123" value="123" readonly>
                </div>
            </div>

            <button class="btn" id="btn-pay">Pay Now</button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">
                This is a simulation. No real money will be charged.
            </p>
        </div>
        <div class="footer">
            Powered by OPay
        </div>
    </div>

    <script>
        // Get query params
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('studentId');
        const amount = urlParams.get('amount');

        if (amount) {
            document.getElementById('display-amount').textContent = `₦${parseFloat(amount).toLocaleString()}`;
        }

        document.getElementById('btn-pay').addEventListener('click', async () => {
            document.getElementById('btn-pay').textContent = 'Processing...';
            document.getElementById('btn-pay').style.opacity = '0.7';
            document.getElementById('btn-pay').style.pointerEvents = 'none';

            try {
                // Fetch outstanding fees to get the first one to pay
                const res = await fetch(`/api/student/outstanding-fees?studentId=${studentId}`);
                const fees = await res.json();
                
                // Find first unpaid or partially paid fee
                const feeToPay = fees.find(f => f.paymentStatus !== 'paid');
                
                if (feeToPay) {
                    // Pay it
                    const payRes = await fetch('/api/student/pay', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            studentId: studentId,
                            paymentCategoryId: feeToPay.id,
                            amount: feeToPay.balanceRemaining // Pay full remaining amount
                        })
                    });

                    if (payRes.ok) {
                        alert('Payment Successful!');
                        window.location.href = `student.html?payment=success`;
                    } else {
                        alert('Error processing payment via API');
                        window.location.href = 'student.html?payment=failed';
                    }
                } else {
                    alert('No outstanding fees found to pay.');
                    window.location.href = 'student.html';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during checkout.');
                window.location.href = 'student.html';
            }
        });
    </script>
</body>
</html>
